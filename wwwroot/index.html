<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Johnson - Profile & Blog</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configure Tailwind for dark mode BEFORE any other scripts
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">

    <!-- Profile Header (Cover & Avatar) -->
    <div class="max-w-5xl mx-auto bg-white shadow rounded-b-lg overflow-hidden dark:bg-gray-800">
        <div class="h-64 bg-gradient-to-r from-blue-500 to-indigo-600 relative">
            <!-- Cover Photo Placeholder -->
        </div>
        <div class="px-6 pb-4 relative flex flex-col sm:flex-row items-center sm:items-end justify-between -mt-16 sm:-mt-10">
            <div class="flex flex-col sm:flex-row items-center gap-4">
                <div class="w-36 h-36 rounded-full border-4 border-white bg-gray-300 overflow-hidden shadow-md dark:border-gray-700">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Profile" class="w-full h-full object-cover">
                </div>
                <div class="text-center sm:text-left mb-2">
                    <h1 class="text-2xl font-bold">Alex Johnson</h1>
                    <p class="text-gray-600 dark:text-gray-400">Software Engineer & Tech Blogger</p>
                </div>
            </div>
            <div class="flex gap-2 mt-4 sm:mt-0">
                <button class="bg-blue-600 text-white px-4 py-2 rounded-md font-semibold text-sm hover:bg-blue-700">+ Add to story</button>
                <button class="bg-gray-200 text-gray-800 px-4 py-2 rounded-md font-semibold text-sm hover:bg-gray-300 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600">Edit profile</button>
            </div>
        </div>
        <!-- Profile Navigation Tabs -->
        <div class="flex border-t px-6 gap-8 text-gray-600 font-semibold text-sm dark:border-gray-700 dark:text-gray-400">
            <button class="py-3 border-b-4 border-blue-600 text-blue-600 dark:border-blue-500 dark:text-blue-500">Posts</button>
            <button class="py-3 hover:text-gray-900 dark:hover:text-gray-200">About</button>
            <button class="py-3 hover:text-gray-900 dark:hover:text-gray-200">Photos</button>
        </div>
    </div>

    <!-- Main Content: Two-Column Layout -->
    <main class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4 mt-4 px-2 sm:px-0">
        
        <!-- Left Sidebar (Intro Card) -->
        <aside class="space-y-4">
            <div class="bg-white p-4 rounded-lg shadow dark:bg-gray-800">
                <h2 class="font-bold text-lg mb-2 dark:text-white">Intro</h2>
                <p class="text-sm text-gray-600 text-center mb-4 dark:text-gray-400">Building clean web apps with .NET & Vanilla JS.</p>
                <div class="space-y-2 text-sm text-gray-700 dark:text-gray-300">
                    <p>📍 Lives in <strong class="dark:text-white">San Francisco, California</strong></p>
                    <p>💼 Works at <strong class="dark:text-white">Self-Employed</strong></p>
                    <p>🔗 <a href="#" class="text-blue-600 hover:underline dark:text-blue-400">github.com/alexjohnson</a></p>
                </div>
            </div>
        </aside>

        <!-- Main Feed -->
        <section class="md:col-span-2 space-y-4">
            
            <!-- Create Post Box -->
            <div class="bg-white p-4 rounded-lg shadow dark:bg-gray-800">
                <form id="post-form" class="flex gap-3">
                    <input type="text" id="post-input" placeholder="What's on your mind, Alex?" 
                           class="flex-1 bg-gray-100 px-4 py-2 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-full font-semibold text-sm hover:bg-blue-700">Post</button>
                </form>
            </div>

            <!-- Dark Theme Toggle Button -->
            <div class="flex justify-end">
                <button id="theme-toggle" class="p-2 rounded-full bg-gray-200 text-gray-800 hover:bg-gray-300 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-blue-500" aria-label="Toggle dark mode">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                </button>
            </div>

            <!-- Dynamic Feed Container -->
            <div id="feed-container">
                <!-- Posts will be rendered here via JS Signals -->
            </div>

        </section>
    </main>

    <script>
        // Set initial theme after DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        });
    </script>

    <!-- Frontend Script using ESM Preact Signals -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
